<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsaForge</title>

    <style>
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#111827;
            color:white;
            text-align:center;
        }

        header{
            padding:80px 20px;
        }

        h1{
            font-size:60px;
            margin:0;
            color:#f97316;
        }

        p{
            font-size:22px;
            color:#d1d5db;
        }

        .botao{
            display:inline-block;
            margin-top:40px;
            padding:18px 40px;
            background:#f97316;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:bold;
        }

        .produtos{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
            padding:60px;
        }

        .card{
            width:250px;
            background:#1f2937;
            border-radius:15px;
            padding:20px;
        }

        .foto{
            height:180px;
            background:#374151;
            border-radius:10px;
        }

        footer{
            padding:40px;
            color:#9ca3af;
        }
    </style>

</head>

<body>

<header>

<h1>IsaForge</h1>

<p>Impressão 3D Premium em Portugal</p>

<a class="botao" href="#">Ver Produtos</a>

</header>

<section class="produtos">

<div class="card">
<div class="foto"></div>
<h3>Organizador</h3>
<p>Em breve</p>
</div>

<div class="card">
<div class="foto"></div>
<h3>Suporte Automóvel</h3>
<p>Em breve</p>
</div>

<div class="card">
<div class="foto"></div>
<h3>Brinquedos</h3>
<p>Em breve</p>
</div>

</section>

<footer>

© 2026 IsaForge

</footer>

</body>

</html>
